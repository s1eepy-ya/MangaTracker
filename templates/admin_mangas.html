{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-12 max-w-7xl">
    <div class="mb-10">
        <h1 class="text-4xl font-black font-display text-white mb-2">
            Управление <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">мангой</span>
        </h1>
        <p class="text-gray-400">Изменяй обложки любой манги</p>
    </div>

    <div class="flex flex-wrap gap-3 mb-8">
        <a href="{{ url_for('admin_add_manga') }}" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl transition">
            ➕ Добавить мангу
        </a>
        <a href="{{ url_for('admin_hero') }}" class="px-5 py-2.5 bg-cardBg border border-borderDark hover:border-primary text-gray-300 text-sm font-semibold rounded-xl transition">
            🖼 Hero-блоки
        </a>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">
        {% for manga in mangas %}
        <div class="bg-cardBg border border-borderDark rounded-xl overflow-hidden hover:border-primary/40 transition">
            <div class="relative aspect-[2/3] bg-gray-900">
                {% if manga.cover_image %}
                <img src="{{ manga.cover_image }}" 
                     onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 300%22><rect fill=%22%23312e81%22 width=%22200%22 height=%22300%22/></svg>';"
                     class="w-full h-full object-cover" alt="{{ manga.title }}">
                {% else %}
                <div class="w-full h-full bg-gradient-to-br from-indigo-900 to-cyan-900"></div>
                {% endif %}
            </div>
            <div class="p-3">
                <h3 class="text-white text-sm font-bold line-clamp-2 mb-2">{{ manga.title }}</h3>
                
                <form method="POST" action="{{ url_for('admin_update_cover', manga_id=manga.id) }}" enctype="multipart/form-data" class="space-y-2">
                    <input type="file" 
                           name="cover_file" 
                           accept="image/*"
                           required
                           class="w-full text-xs text-gray-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
                    <button type="submit" class="w-full py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded transition">
                        Обновить обложку
                    </button>
                </form>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}

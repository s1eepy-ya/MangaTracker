{% extends "base.html" %}

{% block title %}Добавить мангу | Панель Администратора{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
    <div class="bg-cardBg p-8 rounded-3xl border border-gray-800 shadow-2xl">
        <h1 class="text-3xl font-extrabold text-white mb-6">Добавить Мангу вручную</h1>

        <form method="POST" action="{{ url_for('admin_add_manga') }}" class="space-y-6">
            <div>
                <label for="title" class="block text-sm font-medium text-gray-300 mb-2">Название</label>
                <input type="text" name="title" id="title" required 
                    class="w-full px-4 py-3 bg-darkBg border border-gray-750 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary"
                    placeholder="Например: Атака Титанов">
            </div>

            <div>
                <label for="original_title" class="block text-sm font-medium text-gray-300 mb-2">Оригинальное название</label>
                <input type="text" name="original_title" id="original_title" 
                    class="w-full px-4 py-3 bg-darkBg border border-gray-750 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary"
                    placeholder="Shingeki no Kyojin">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="release_year" class="block text-sm font-medium text-gray-300 mb-2">Год релиза</label>
                    <input type="number" name="release_year" id="release_year" 
                        class="w-full px-4 py-3 bg-darkBg border border-gray-750 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary"
                        placeholder="2009">
                </div>
                <div>
                    <label for="status" class="block text-sm font-medium text-gray-300 mb-2">Статус</label>
                    <select name="status" id="status" 
                        class="w-full px-4 py-3 bg-darkBg border border-gray-750 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="ONGOING">Онгоинг</option>
                        <option value="COMPLETED">Завершено</option>
                        <option value="CANCELLED">Анонсировано</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label for="rating" class="block text-sm font-medium text-gray-300 mb-2">Рейтинг</label>
                    <input type="number" step="0.1" min="0" max="10" name="rating" id="rating" value="8.5"
                        class="w-full px-4 py-3 bg-darkBg border border-gray-750 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label for="chapters" class="block text-sm font-medium text-gray-300 mb-2">Главы</label>
                    <input type="number" name="chapters" id="chapters" value="0"
                        class="w-full px-4 py-3 bg-darkBg border border-gray-750 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label for="volumes" class="block text-sm font-medium text-gray-300 mb-2">Тома</label>
                    <input type="number" name="volumes" id="volumes" value="0"
                        class="w-full px-4 py-3 bg-darkBg border border-gray-750 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-gray-300 mb-2">Описание</label>
                <textarea name="description" id="description" rows="5"
                    class="w-full p-4 bg-darkBg border border-gray-750 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary"
                    placeholder="Введите описание манги..."></textarea>
            </div>

            <div>
                <label for="cover_image" class="block text-sm font-medium text-gray-300 mb-2">Обложка</label>
                <select name="cover_image" id="cover_image" 
                    class="w-full px-4 py-3 bg-darkBg border border-gray-750 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-primary">
                    <option value="block1.jpg">Обложка 1 (Левый арт)</option>
                    <option value="block2.jpg">Обложка 2 (Магическая битва)</option>
                    <option value="block3.png">Обложка 3</option>
                    <option value="block4.png">Обложка 4</option>
                    <option value="block5.png">Обложка 5</option>
                    <option value="block6.png">Обложка 6</option>
                </select>
            </div>

            <button type="submit" 
                class="w-full py-3.5 bg-primary hover:bg-blue-600 text-white font-bold rounded-xl transition duration-300 shadow-lg shadow-blue-500/25">
                Создать
            </button>
        </form>
    </div>
</div>
{% endblock %}

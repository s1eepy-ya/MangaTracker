{% extends "base.html" %}

{% block title %}Вход | MangaTracker{% endblock %}

{% block content %}
<!-- Фоновые эффекты -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute top-[20%] left-[10%] w-[500px] h-[500px] bg-indigo-600/15 rounded-full blur-[150px]"></div>
    <div class="absolute bottom-[20%] right-[10%] w-[400px] h-[400px] bg-cyan-600/15 rounded-full blur-[150px]"></div>
</div>

<div class="container mx-auto px-4 py-20 flex items-center justify-center min-h-[calc(100vh-100px)]">
    <div class="bg-cardBg/80 backdrop-blur-xl p-10 rounded-3xl shadow-2xl border border-borderDark w-full max-w-md relative overflow-hidden group">
        <!-- Свечение рамки -->
        <div class="absolute inset-0 bg-gradient-to-tr from-indigo-500/10 to-cyan-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>

        <div class="relative z-10">
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-cyan-500 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/40">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                </div>
            </div>

            <h2 class="text-3xl font-black text-center mb-8 text-white tracking-tight">Добро пожаловать</h2>

            <form method="POST" action="{{ url_for('login') }}" class="space-y-6">
                <div>
                    <label for="username" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Логин</label>
                    <input type="text" name="username" id="username" required 
                        class="w-full px-5 py-4 bg-darkBg border border-borderDark hover:border-indigo-500/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/50 text-white placeholder-gray-600 transition-all shadow-inner" 
                        placeholder="Введите ваш логин">
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Пароль</label>
                    <input type="password" name="password" id="password" required 
                        class="w-full px-5 py-4 bg-darkBg border border-borderDark hover:border-indigo-500/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/50 text-white placeholder-gray-600 transition-all shadow-inner" 
                        placeholder="••••••••">
                </div>

                <button type="submit" 
                    class="w-full py-4 bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white font-bold text-lg rounded-xl transition-all transform hover:-translate-y-1 hover:shadow-[0_10px_30px_rgba(99,102,241,0.4)]">
                    Войти в систему
                </button>
            </form>

            <p class="mt-8 text-center text-sm text-gray-400">
                Ещё нет аккаунта? 
                <a href="{{ url_for('register') }}" class="text-cyan-400 hover:text-cyan-300 hover:underline font-bold transition-colors">Создать сейчас</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

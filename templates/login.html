{% extends "base.html" %}

{% block title %}Вход | MangaTracker{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-16 flex items-center justify-center">
    <div class="bg-cardBg p-8 rounded-2xl shadow-xl border border-gray-800 w-full max-w-md">
        <h2 class="text-3xl font-extrabold text-center mb-6 text-white">Вход в аккаунт</h2>
        


        <form method="POST" action="{{ url_for('login') }}" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-300 mb-2">Имя пользователя</label>
                <input type="text" name="username" id="username" required 
                    class="w-full px-4 py-3 bg-darkBg border border-gray-750 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-white placeholder-gray-500" 
                    placeholder="Введите имя пользователя">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Пароль</label>
                <input type="password" name="password" id="password" required 
                    class="w-full px-4 py-3 bg-darkBg border border-gray-750 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-white placeholder-gray-500" 
                    placeholder="••••••••">
            </div>

            <button type="submit" 
                class="w-full py-3 bg-primary hover:bg-blue-600 text-white font-bold rounded-lg transition duration-300 shadow-lg shadow-blue-500/20">
                Войти
            </button>
        </form>

        <p class="mt-8 text-center text-sm text-gray-400">
            Нет аккаунта? 
            <a href="{{ url_for('register') }}" class="text-primary hover:underline font-semibold">Зарегистрироваться</a>
        </p>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Регистрация | MangaTracker{% endblock %}

{% block content %}
<!-- Фоновые эффекты -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute top-[20%] right-[10%] w-[500px] h-[500px] bg-pink-600/15 rounded-full blur-[150px]"></div>
    <div class="absolute bottom-[20%] left-[10%] w-[400px] h-[400px] bg-indigo-600/15 rounded-full blur-[150px]"></div>
</div>

<div class="container mx-auto px-4 py-16 flex items-center justify-center min-h-[calc(100vh-100px)]">
    <div class="bg-cardBg/80 backdrop-blur-xl p-10 rounded-3xl shadow-2xl border border-borderDark w-full max-w-md relative overflow-hidden group">
        <!-- Свечение рамки -->
        <div class="absolute inset-0 bg-gradient-to-tr from-pink-500/10 to-indigo-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>

        <div class="relative z-10">
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 bg-gradient-to-br from-pink-500 to-indigo-500 rounded-2xl flex items-center justify-center shadow-lg shadow-pink-500/40">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                </div>
            </div>

            <h2 class="text-3xl font-black text-center mb-8 text-white tracking-tight">Создать аккаунт</h2>

            <form method="POST" action="{{ url_for('register') }}" class="space-y-5">
                <div>
                    <label for="username" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Логин</label>
                    <input type="text" name="username" id="username" required 
                        class="w-full px-5 py-3.5 bg-darkBg border border-borderDark hover:border-pink-500/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500/50 text-white placeholder-gray-600 transition-all shadow-inner" 
                        placeholder="Придумайте логин">
                </div>

                <div>
                    <label for="email" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Email</label>
                    <input type="email" name="email" id="email" required 
                        class="w-full px-5 py-3.5 bg-darkBg border border-borderDark hover:border-pink-500/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500/50 text-white placeholder-gray-600 transition-all shadow-inner" 
                        placeholder="your@email.com">
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Пароль</label>
                    <input type="password" name="password" id="password" required 
                        class="w-full px-5 py-3.5 bg-darkBg border border-borderDark hover:border-pink-500/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500/50 text-white placeholder-gray-600 transition-all shadow-inner" 
                        placeholder="••••••••">
                </div>

                <button type="submit" 
                    class="w-full py-4 mt-2 bg-gradient-to-r from-pink-600 to-indigo-600 hover:from-pink-500 hover:to-indigo-500 text-white font-bold text-lg rounded-xl transition-all transform hover:-translate-y-1 hover:shadow-[0_10px_30px_rgba(236,72,153,0.4)]">
                    Зарегистрироваться
                </button>
            </form>

            <p class="mt-8 text-center text-sm text-gray-400">
                Уже есть аккаунт? 
                <a href="{{ url_for('login') }}" class="text-pink-400 hover:text-pink-300 hover:underline font-bold transition-colors">Войти</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
